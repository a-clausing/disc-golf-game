<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Disc Golf — Practice Park</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#9ad6ee;font-family:system-ui;color:#fff}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;touch-action:manipulation;border:0;color:white;font-weight:800}#top{position:absolute;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}#top>div,#top button{background:#164e43dd;border-radius:14px;padding:11px 15px;box-shadow:0 3px 8px #0002}#top small{font-size:10px;display:block;opacity:.85}#bottom{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#174e43 15%);padding:35px 12px max(15px,env(safe-area-inset-bottom))}#discs{display:flex;gap:7px;margin-bottom:8px}#discs button{flex:1;background:#286a5d;border:2px solid transparent;border-radius:12px;padding:11px 3px;font-size:13px}#discs button.active{background:#409f7f;border-color:#fff}#aim{display:flex;gap:9px;align-items:center}#aim label{font-size:12px;font-weight:800}#power{flex:1;accent-color:#f8d55a;height:32px;touch-action:pan-x}#throw{background:#ed9d37;padding:16px 20px;border-radius:13px;font-size:17px}#hint{text-align:center;font-size:12px;margin-bottom:9px;text-shadow:0 1px 3px #153b36}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);background:#164e43ed;padding:13px 19px;border-radius:13px;display:none;white-space:nowrap;font-weight:800}#end{position:absolute;inset:0;background:#153b36d9;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}#end button{background:#e7a04a;border-radius:12px;padding:14px 20px}#error{position:absolute;top:38%;left:15px;right:15px;text-align:center;background:#173d38;padding:20px;border-radius:15px;display:none}</style></head><body><div id="ui"><div id="top"><div><small>PRACTICE PARK • LEVEL 1</small><strong id="score">0 THROWS · 0/5</strong></div><button id="reset">↻ Restart</button></div><div id="toast"></div><div id="bottom"><div id="hint">Swipe to rotate · Pinch to zoom · Second finger cancels shot</div><div id="discs"><button data-disc="0">🟡 Driver</button><button data-disc="1" class="active">🔵 Midrange</button><button data-disc="2">🔴 Putter</button></div><div id="hook" style="display:none;gap:8px;margin-bottom:8px"><button data-hook="-1" style="flex:1;background:#286a5d;padding:10px;border-radius:10px">↶ Left hook</button><button data-hook="1" style="flex:1;background:#286a5d;padding:10px;border-radius:10px">↷ Right hook</button></div><div id="aim"><label id="aimstatus">Hold the disc and pull backward to throw</label></div></div><div id="end"><h1>🏆 Course complete!</h1><p id="result"></p><button onclick="location.reload()">Play again</button></div><div id="error"></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd9ef);scene.fog=null;
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.5,1000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x60966e,2.1));const sun=new THREE.DirectionalLight(0xfff5d7,2.2);sun.position.set(-70,110,40);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const grass=mat(0x61b77a),fairway=mat(0x84ce8a),trunk=mat(0x956b4a),leaf=mat(0x288759),leaf2=mat(0x39a56b),sand=mat(0xe8c48c),water=mat(0x3aabd8),metal=mat(0xe3e8e5);
function mesh(geo,m,x,y,z,shadow=false){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
const ground=mesh(new THREE.PlaneGeometry(530,530),grass,0,0,0);ground.rotation.x=-Math.PI/2;
const tee=new THREE.Vector3(0,0,150);const targets=[new THREE.Vector3(-95,0,35),new THREE.Vector3(75,0,-80),new THREE.Vector3(155,0,85),new THREE.Vector3(-145,0,-125),new THREE.Vector3(5,0,-195)];
const colors=[0xf45b56,0xffd14f,0x70df72,0x75a8ff,0xc998f1];
for(const t of targets){let strip=mesh(new THREE.PlaneGeometry(38,150),fairway,(t.x+tee.x)/2,.06,(t.z+tee.z)/2);strip.rotation.x=-Math.PI/2;strip.rotation.z=-Math.atan2(t.x-tee.x,t.z-tee.z)}
const lake=mesh(new THREE.CircleGeometry(47,40),water,48,.14,-33);lake.rotation.x=-Math.PI/2;lake.scale.set(1.5,1,1);
for(let i=0;i<13;i++){let x=(Math.sin(i*2.7)*110),z=(Math.cos(i*3.8)*115);if(Math.hypot(x-48,z+33)<67)continue;let patch=mesh(new THREE.CircleGeometry(8+i%5*3,20),sand,x,.09,z);patch.rotation.x=-Math.PI/2}
const trees=[];let seed=1234;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<140;i++){let x=(rnd()-.5)*470,z=(rnd()-.5)*470;if(Math.hypot(x,z-150)<28||targets.some(t=>Math.hypot(x-t.x,z-t.z)<19)||Math.hypot(x-48,z+33)<65)continue;const h=9+rnd()*15;mesh(new THREE.CylinderGeometry(1.4,2.1,h*.55,7),trunk,x,h*.275,z,true);const radius=6+rnd()*4;let top=mesh(new THREE.ConeGeometry(radius,h,7),i%2?leaf:leaf2,x,h*.72,z,true);trees.push({x,z,r:radius,h,base:h*.22,top:h*1.22,trunkR:2.1})}
const baskets=[];targets.forEach((p,i)=>{const group=new THREE.Group();group.position.copy(p);scene.add(group);
const color=mat(colors[i]),dark=mat(0x465f60),silver=mat(0xdde7e6);
function part(geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;group.add(o);return o}
part(new THREE.CylinderGeometry(.48,.55,12,12),silver,0,6,0);
part(new THREE.CylinderGeometry(5.2,4.8,.8,24),color,0,11.4,0);
part(new THREE.CylinderGeometry(5.6,5.2,.5,24),silver,0,11.95,0);
part(new THREE.CylinderGeometry(4.6,3.8,1.6,24,1,true),color,0,5.8,0);
part(new THREE.CylinderGeometry(4.3,4.3,.35,24),dark,0,5.15,0);
const rim=part(new THREE.TorusGeometry(4.65,.35,8,28),silver,0,6.6,0);rim.rotation.x=Math.PI/2;
for(let j=0;j<16;j++){const ang=j*Math.PI/8;const outer=new THREE.Vector3(Math.cos(ang)*3.8,10.95,Math.sin(ang)*3.8);const inner=new THREE.Vector3(Math.cos(ang)*2.3,6.7,Math.sin(ang)*2.3);const v=inner.clone().sub(outer),chain=part(new THREE.CylinderGeometry(.12,.12,v.length(),6),silver,(outer.x+inner.x)/2,(outer.y+inner.y)/2,(outer.z+inner.z)/2);chain.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize())}
part(new THREE.CylinderGeometry(.18,.18,8,8),silver,0,15.5,0);
const shape=new THREE.Shape();shape.moveTo(0,0);shape.lineTo(11,0);shape.lineTo(9,-5.5);shape.lineTo(0,-5.5);shape.closePath();const flag=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshBasicMaterial({color:colors[i],side:THREE.DoubleSide}));flag.position.set(0,19.5,0);group.add(flag);
baskets.push(group)});
const discMats=[mat(0xffd345),mat(0x5ac1f5),mat(0xf56c6c)];const disc=mesh(new THREE.CylinderGeometry(2.1,2.1,.35,24),discMats[1],tee.x,1.4,tee.z,true);const shadow=mesh(new THREE.CircleGeometry(2.4,20),mat(0x40865c),tee.x,.1,tee.z);shadow.rotation.x=-Math.PI/2;
let hook=-1,underTree=false,catchAnim=null;let position=tee.clone(),yaw=.35,zoom=135,pitch=.70,selected=1,power=.65,shots=0,completed=new Set(),flying=null,drag=null,pointers=new Map(),pinch=0,aiming=null;const guide=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,vertexShader:'attribute float fadeAlpha; varying float vFade; void main(){vFade=fadeAlpha;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying float vFade; void main(){gl_FragColor=vec4(1.0,1.0,1.0,vFade);}'}));scene.add(guide);guide.visible=false;
function sync(){document.querySelector('#hook').style.display=selected===0?'flex':'none';document.querySelectorAll('[data-hook]').forEach(b=>b.style.outline=+b.dataset.hook===hook?'2px solid white':'none');document.querySelector('#score').textContent=shots+' THROWS · '+completed.size+'/5';document.querySelectorAll('[data-disc]').forEach(b=>b.classList.toggle('active',+b.dataset.disc===selected));}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',1700)}
function focus(t){yaw=Math.atan2(t.x-position.x,t.z-position.z)}
function updateCamera(){const target=new THREE.Vector3(position.x,3,position.z);const dist=zoom;camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(target.x,5,target.z)}
function reset(){location.reload()}
document.querySelector('#reset').onclick=reset;document.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{selected=+b.dataset.disc;disc.material=discMats[selected];sync()});function flightPoint(f,t){const height=[16,12,7][f.d]*Math.min(1,f.len/[170,115,65][f.d]);const curve=f.d===0?(f.hook||-1)*Math.min(38,f.len*.22)*t*t:0;return new THREE.Vector3(f.start.x+f.dir.x*f.len*t-f.dir.z*curve,7+height*Math.sin(Math.PI*t)-6.5*t*t,f.start.z+f.dir.z*f.len*t+f.dir.x*curve)}
function completeBasket(i){completed.add(i);position.copy(targets[i]);catchAnim={i,t:0};toast('Basket '+(i+1)+' caught!');if(completed.size===5){document.querySelector('#result').textContent=shots+' total throws';document.querySelector('#end').style.display='flex'}}
function cancelAim(){aiming=null;guide.visible=false;disc.position.y=.5;document.querySelector('#aimstatus').textContent='Canceled · hold disc to aim again'}
function launch(dir,len){if(flying||catchAnim||completed.size===5)return;flying={start:position.clone(),dir,len,t:0,d:selected,hook,underTree};underTree=false;shots++;guide.visible=false;document.querySelector('#aimstatus').textContent='Disc in flight…';sync()}
function aimUpdate(e){if(!aiming)return;const dx=e.clientX-aiming.x,dy=e.clientY-aiming.y;const pull=Math.hypot(dx,dy);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const dir=forward.multiplyScalar(dy).addScaledVector(right,-dx*.9).normalize();const len=[170,115,65][selected]*Math.min(1,pull/155)*(underTree?.32:1);aiming.dir=dir;aiming.len=len;const pts=[];const f={start:position,dir,len,d:selected,hook};for(let j=0;j<=48;j++)pts.push(flightPoint(f,j/48));const verts=[],cols=[],indices=[];const side=new THREE.Vector3();for(let j=0;j<pts.length;j++){const t=j/(pts.length-1);const tangent=pts[Math.min(j+1,pts.length-1)].clone().sub(pts[Math.max(0,j-1)]).normalize();side.set(-tangent.z,0,tangent.x).normalize();const width=.85*Math.pow(Math.max(0,1-t/.72),1.4)+.005;const opacity=.58*Math.pow(Math.max(0,1-t/.72),1.15);const center=pts[j].clone();center.y=Math.min(center.y,7-.18);const l=center.clone().addScaledVector(side,width),r=center.clone().addScaledVector(side,-width);verts.push(l.x,l.y,l.z,r.x,r.y,r.z);cols.push(opacity,opacity);if(j<pts.length-1){const k=j*2;indices.push(k,k+1,k+2,k+1,k+3,k+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('fadeAlpha',new THREE.Float32BufferAttribute(cols,1));geo.setIndex(indices);guide.geometry.dispose();guide.geometry=geo;guide.visible=pull>8;document.querySelector('#aimstatus').textContent='Release to throw · '+Math.round(len)+' ft'}
document.querySelectorAll('[data-hook]').forEach(b=>b.onclick=()=>{hook=+b.dataset.hook;sync()});const canvas=renderer.domElement;
function discScreen(){const p=new THREE.Vector3(position.x,1.5,position.z).project(camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);if(aiming&&e.pointerId!==aiming.id){cancelAim();pointers.clear();return;}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&!flying&&!catchAnim){const p=discScreen();if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<75){aiming={id:e.pointerId,x:e.clientX,y:e.clientY,dir:null,len:0};disc.position.y=7;document.querySelector('#aimstatus').textContent='Pull back and sideways…';return}}drag={x:e.clientX,y:e.clientY,moved:false};pinch=0});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId),dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;if(aiming&&aiming.id===e.pointerId){aimUpdate(e);return}if(pointers.size===1){yaw-=dx*.004;if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)zoom=Math.max(65,Math.min(310,zoom*pinch/d));pinch=d}updateCamera()});
canvas.addEventListener('pointerup',e=>{if(aiming&&aiming.id===e.pointerId){if(aiming.dir&&aiming.len>7)launch(aiming.dir,aiming.len);else{guide.visible=false;document.querySelector('#aimstatus').textContent='Hold the disc and pull backward to throw'}aiming=null;pointers.delete(e.pointerId);return}pointers.delete(e.pointerId);pinch=0;drag=null});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(aiming&&aiming.id===e.pointerId){cancelAim();}drag=null;pinch=0});
canvas.addEventListener('wheel',e=>{zoom=Math.max(65,Math.min(310,zoom+e.deltaY*.08));e.preventDefault()},{passive:false});
let last=performance.now();
function treeRadiusAt(tr,y){if(y>=tr.base&&y<=tr.top)return tr.r*(tr.top-y)/(tr.top-tr.base);if(y>=0&&y<=tr.h*.55)return tr.trunkR;return 0}
function underCanopy(x,z){return trees.some(tr=>Math.hypot(x-tr.x,z-tr.z)<tr.r)}
function land(p){position.set(p.x,0,p.z);if(Math.hypot(p.x-48,p.z+33)<50){shots++;position.copy(flying.start);toast('Water hazard · +1 throw')}underTree=underCanopy(position.x,position.z);flying=null;disc.position.set(position.x,.5,position.z);shadow.position.set(position.x,.1,position.z);document.querySelector('#aimstatus').textContent=underTree?'Under trees: next throw has reduced distance':'Hold the disc and pull backward to throw';sync()}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;
if(catchAnim){catchAnim.t+=dt;const target=targets[catchAnim.i];disc.position.set(target.x,Math.max(5.6,10-catchAnim.t*12),target.z);disc.rotation.set(0,0,0);if(catchAnim.t>.65){baskets[catchAnim.i].visible=false;catchAnim=null;disc.position.set(position.x,.5,position.z);shadow.position.set(position.x,.1,position.z)}}
else if(flying){
const f=flying;
if(f.bounce){f.bounce.t+=dt;const t=Math.min(1,f.bounce.t/.55),q=f.bounce;const p=new THREE.Vector3(q.start.x+q.velocity.x*t*9,q.start.y+q.velocity.y*t*5-12*t*t,q.start.z+q.velocity.z*t*9);disc.position.set(p.x,Math.max(.5,p.y),p.z);shadow.position.set(p.x,.1,p.z);disc.rotation.z=Math.sin(t*Math.PI)*.25;if(t>=1||p.y<=.5&&t>.3){land(p)}}
else{
const previous=f.t;f.t=Math.min(1,f.t+dt/1.55);const p=flightPoint(f,f.t);disc.position.copy(p);disc.rotation.set(0,disc.rotation.y+dt*9,0);shadow.position.set(p.x,.1,p.z);
let caught=-1,hit=null;const n=Math.max(1,Math.ceil((f.t-previous)*f.len/1.5));
for(let k=1;k<=n&&!hit&&caught<0;k++){const tt=previous+(f.t-previous)*k/n,q=flightPoint(f,tt);
for(let i=0;i<targets.length;i++){if(completed.has(i))continue;const target=targets[i];if(Math.hypot(q.x-target.x,q.z-target.z)<4.5&&q.y>=6.5&&q.y<=12.3){caught=i;break}}
if(caught>=0)break;
if(!f.underTree||tt>.17){for(const tr of trees){if(Math.hypot(q.x-tr.x,q.z-tr.z)<treeRadiusAt(tr,q.y)+.6&&treeRadiusAt(tr,q.y)>0){hit={q,tr,tt};break}}}
}
if(caught>=0){completeBasket(caught);flying=null;guide.visible=false;document.querySelector('#aimstatus').textContent='Hold the disc and pull backward to throw';sync()}
else if(hit){const q=hit.q,normal=new THREE.Vector3(q.x-hit.tr.x,0,q.z-hit.tr.z).normalize();if(normal.lengthSq()<.01)normal.set(1,0,0);const tangent=new THREE.Vector3(-normal.z,0,normal.x);const side=tangent.dot(f.dir);const velocity=normal.multiplyScalar(.45+Math.min(.55,f.len/260)).addScaledVector(tangent,side*.45);velocity.y=Math.max(.2,.7-q.y/60);f.bounce={start:q.clone(),velocity,t:0};toast('Tree bounce!')}
else if(f.t>=1)land(p)
}}
else if(!aiming){disc.position.set(position.x,.5,position.z);shadow.position.set(position.x,.1,position.z)}
updateCamera();renderer.render(scene,camera)}sync();updateCamera();requestAnimationFrame(animate);
}catch(err){const e=document.querySelector('#error');e.style.display='block';e.textContent='Unable to load 3D game: '+err.message;console.error(err)}
</script></body></html>

<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14634c"><title>Disc Golf — Level 1</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#229bd1;color:#fff;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}header div,header button{background:#155c4ce8;border:0;border-radius:14px;color:#fff;padding:12px;font-weight:800}header button{pointer-events:auto}footer{position:fixed;bottom:0;width:100%;padding:12px 12px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#134d43 25%);display:flex;gap:8px}footer button{flex:1;border:2px solid transparent;border-radius:14px;padding:12px 3px;background:#23695d;color:white;font-weight:800}footer button.active{border-color:white;background:#398f78}#msg{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#145847eb;padding:12px 18px;border-radius:12px;white-space:nowrap;display:none;font-weight:800}#end{display:none;position:fixed;inset:0;background:#123b36d9;align-items:center;justify-content:center;flex-direction:column;text-align:center}#end button{padding:14px;border:0;border-radius:12px;background:#a3eb8d;font-weight:800}</style></head><body><canvas id="c"></canvas><header><div><span id="shots">0</span> THROWS · <span id="done">0</span>/5</div><button id="restart">↻ Restart</button></header><div id="msg"></div><footer><button data-d="0">🟡 Driver</button><button data-d="1" class="active">🔵 Midrange</button><button data-d="2">🔴 Putter</button></footer><div id="end"><h1>Course Complete!</h1><p id="total"></p><button onclick="location.reload()">Play again</button></div><script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),W=400,H=700;let sc,ox,oy;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;sc=Math.min(c.width/W,c.height/H);ox=(c.width-W*sc)/2;oy=(c.height-H*sc)/2}addEventListener('resize',resize);resize();const baskets=[[85,125,'#fa5858'],[309,116,'#ffd354'],[316,336,'#89ef78'],[79,376,'#87b7ff'],[196,254,'#d4a0ff']],trees=[[38,85],[156,90],[241,66],[359,77],[27,236],[154,169],[260,207],[370,239],[129,327],[211,391],[353,427],[44,452],[147,485],[281,502],[73,548],[330,558]];let ball={x:198,y:590},shots=0,done=new Set(),disc=1,drag=null,flight=null,last=0;const $=q=>document.querySelector(q);function update(){$('#shots').textContent=shots;$('#done').textContent=done.size;document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('active',+b.dataset.d===disc))}function toast(t){$('#msg').textContent=t;$('#msg').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#msg').style.display='none',1700)}function pos(e){return{x:(e.clientX*devicePixelRatio-ox)/sc,y:(e.clientY*devicePixelRatio-oy)/sc}}function point(f,t){let curve=[30,10,2][f.d]*Math.sin(Math.PI*t)*t;return{x:f.x+f.dx*f.len*t-f.dy*curve,y:f.y+f.dy*f.len*t+f.dx*curve}}c.addEventListener('pointerdown',e=>{if(flight||done.size===5)return;c.setPointerCapture(e.pointerId);drag=pos(e)});c.addEventListener('pointermove',e=>{if(drag)drag=pos(e)});c.addEventListener('pointercancel',()=>drag=null);c.addEventListener('pointerup',e=>{if(!drag||flight)return;let p=pos(e),dx=ball.x-p.x,dy=ball.y-p.y,l=Math.hypot(dx,dy);drag=null;if(l<10)return;flight={x:ball.x,y:ball.y,dx:dx/l,dy:dy/l,len:[240,170,95][disc]*Math.min(1,l/150),d:disc,t:0};shots++;update()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!flight){disc=+b.dataset.d;update()}});$('#restart').onclick=()=>location.reload();function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function polygon(p,col){g.fillStyle=col;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function tree(x,y){circle(x+7,y+10,18,'#206f4d');g.fillStyle='#a57952';g.fillRect(x-3,y-4,6,19);circle(x,y-14,18,'#146746');circle(x-7,y-18,13,'#27975e');circle(x+5,y-21,11,'#2ba263')}function basket(b,i){let [x,y,col]=b;if(done.has(i)){circle(x,y,13,'#2b7052');circle(x,y,6,'#b6ffce');return}circle(x+4,y+7,18,'#246e51');circle(x,y,15,col);circle(x,y,11,'#285a4c');g.strokeStyle='white';g.lineWidth=2;for(let k=-7;k<=7;k+=7){g.beginPath();g.moveTo(x+k,y-7);g.lineTo(x+k/2,y+6);g.stroke()}g.beginPath();g.moveTo(x,y-10);g.lineTo(x,y-30);g.stroke();polygon([[x,y-30],[x+17,y-24],[x,y-18]],col)}function draw(){g.setTransform(1,0,0,1,0,0);g.fillStyle='#2da9df';g.fillRect(0,0,c.width,c.height);g.setTransform(sc,0,0,sc,ox,oy);polygon([[10,53],[331,28],[392,104],[387,567],[336,648],[41,654],[7,589]],'#c68f62');polygon([[10,40],[331,15],[383,92],[377,551],[327,635],[43,641],[13,577]],'#4bb975');g.strokeStyle='#7dd69b';g.lineWidth=40;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(198,590);g.lineTo(79,376);g.lineTo(196,254);g.lineTo(85,125);g.lineTo(309,116);g.lineTo(316,336);g.stroke();g.fillStyle='#d9b17c';g.beginPath();g.ellipse(265,525,40,25,-.4,0,7);g.fill();g.fillStyle='#259ed2';g.beginPath();g.ellipse(247,419,38,24,.3,0,7);g.fill();g.strokeStyle='#a2e8ff';g.lineWidth=3;g.stroke();trees.forEach(t=>tree(...t));baskets.forEach(basket);if(drag&&!flight){let dx=ball.x-drag.x,dy=ball.y-drag.y,l=Math.hypot(dx,dy);if(l>10){let f={x:ball.x,y:ball.y,dx:dx/l,dy:dy/l,len:[240,170,95][disc]*Math.min(1,l/150),d:disc};g.strokeStyle='white';g.lineWidth=3;g.setLineDash([5,7]);g.beginPath();for(let i=0;i<=30;i++){let p=point(f,i/30);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke();g.setLineDash([])}}let p=flight?point(flight,flight.t):ball;circle(p.x+4,p.y+7,9,'#215b4588');let z=flight?Math.sin(Math.PI*flight.t)*42:0;circle(p.x,p.y-z,9,['#ffd64d','#65c8ff','#ff7373'][flight?flight.d:disc]);g.strokeStyle='white';g.lineWidth=2;g.beginPath();g.ellipse(p.x,p.y-z,9,3,-.25,0,7);g.stroke()}function tick(ms){let dt=Math.min(.05,(ms-last)/1000||.016);last=ms;if(flight){flight.t=Math.min(1,flight.t+dt/1.1);if(flight.t===1){let p=point(flight,1);if(trees.some(t=>Math.hypot(p.x-t[0],p.y-t[1])<18)){p.x=flight.x+(p.x-flight.x)*.7;p.y=flight.y+(p.y-flight.y)*.7;toast('Tree hit!')}if(((p.x-247)/38)**2+((p.y-419)/24)**2<1){p={x:198,y:590};shots++;toast('Water: +1 throw')}ball={x:Math.max(20,Math.min(375,p.x)),y:Math.max(35,Math.min(625,p.y))};let hit=baskets.findIndex((b,i)=>!done.has(i)&&Math.hypot(ball.x-b[0],ball.y-b[1])<23);if(hit!==-1){done.add(hit);ball={x:baskets[hit][0],y:baskets[hit][1]+17};toast('Basket '+(hit+1)+' complete!');if(done.size===5){$('#total').textContent=shots+' total throws';$('#end').style.display='flex'}}flight=null;update()}}draw();requestAnimationFrame(tick)}update();requestAnimationFrame(tick)})();</script></body></html>

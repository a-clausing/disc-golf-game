<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Disc Golf — Practice Park</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#9ad6ee;font-family:system-ui;color:#fff}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;touch-action:manipulation;border:0;color:white;font-weight:800}#top{position:absolute;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}#top>div,#top button{background:#164e43dd;border-radius:14px;padding:11px 15px;box-shadow:0 3px 8px #0002}#top small{font-size:10px;display:block;opacity:.85}#bottom{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#174e43 15%);padding:35px 12px max(15px,env(safe-area-inset-bottom))}#discs{display:flex;gap:7px;margin-bottom:8px}#discs button{flex:1;background:#286a5d;border:2px solid transparent;border-radius:12px;padding:11px 3px;font-size:13px}#discs button.active{background:#409f7f;border-color:#fff}#aim{display:flex;gap:9px;align-items:center}#aim label{font-size:12px;font-weight:800}#power{flex:1;accent-color:#f8d55a;height:32px;touch-action:pan-x}#throw{background:#ed9d37;padding:16px 20px;border-radius:13px;font-size:17px}#hint{text-align:center;font-size:12px;margin-bottom:9px;text-shadow:0 1px 3px #153b36}#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);background:#164e43ed;padding:13px 19px;border-radius:13px;display:none;white-space:nowrap;font-weight:800}#end{position:absolute;inset:0;background:#153b36d9;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}#end button{background:#e7a04a;border-radius:12px;padding:14px 20px}#error{position:absolute;top:38%;left:15px;right:15px;text-align:center;background:#173d38;padding:20px;border-radius:15px;display:none}</style></head><body><div id="ui"><div id="top"><div><small>PRACTICE PARK • LEVEL 1</small><strong id="score">0 THROWS · 0/5</strong></div><button id="reset">↻ Restart</button></div><div id="toast"></div><div id="bottom"><div id="hint">Swipe sideways to rotate · Pinch to zoom · Fixed viewing angle</div><div id="discs"><button data-disc="0">🟡 Driver</button><button data-disc="1" class="active">🔵 Midrange</button><button data-disc="2">🔴 Putter</button></div><div id="aim"><label>POWER <span id="pct">65%</span></label><input id="power" type="range" min="10" max="100" value="65"><button id="throw">THROW ↗</button></div></div><div id="end"><h1>🏆 Course complete!</h1><p id="result"></p><button onclick="location.reload()">Play again</button></div><div id="error"></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd9ef);scene.fog=null;
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.5,1000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x60966e,2.1));const sun=new THREE.DirectionalLight(0xfff5d7,2.2);sun.position.set(-70,110,40);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;scene.add(sun);
const mat=(c)=>new THREE.MeshLambertMaterial({color:c});const grass=mat(0x61b77a),fairway=mat(0x84ce8a),trunk=mat(0x956b4a),leaf=mat(0x288759),leaf2=mat(0x39a56b),sand=mat(0xe8c48c),water=mat(0x3aabd8),metal=mat(0xe3e8e5);
function mesh(geo,m,x,y,z,shadow=false){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
const ground=mesh(new THREE.PlaneGeometry(530,530),grass,0,0,0);ground.rotation.x=-Math.PI/2;
const tee=new THREE.Vector3(0,0,150);const targets=[new THREE.Vector3(-95,0,35),new THREE.Vector3(75,0,-80),new THREE.Vector3(155,0,85),new THREE.Vector3(-145,0,-125),new THREE.Vector3(5,0,-195)];
const colors=[0xf45b56,0xffd14f,0x70df72,0x75a8ff,0xc998f1];
for(const t of targets){let strip=mesh(new THREE.PlaneGeometry(38,150),fairway,(t.x+tee.x)/2,.06,(t.z+tee.z)/2);strip.rotation.x=-Math.PI/2;strip.rotation.z=-Math.atan2(t.x-tee.x,t.z-tee.z)}
const lake=mesh(new THREE.CircleGeometry(47,40),water,48,.14,-33);lake.rotation.x=-Math.PI/2;lake.scale.set(1.5,1,1);
for(let i=0;i<13;i++){let x=(Math.sin(i*2.7)*110),z=(Math.cos(i*3.8)*115);if(Math.hypot(x-48,z+33)<67)continue;let patch=mesh(new THREE.CircleGeometry(8+i%5*3,20),sand,x,.09,z);patch.rotation.x=-Math.PI/2}
const trees=[];let seed=1234;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<140;i++){let x=(rnd()-.5)*470,z=(rnd()-.5)*470;if(Math.hypot(x,z-150)<28||targets.some(t=>Math.hypot(x-t.x,z-t.z)<19)||Math.hypot(x-48,z+33)<65)continue;const h=9+rnd()*15;mesh(new THREE.CylinderGeometry(1.4,2.1,h*.55,7),trunk,x,h*.275,z,true);let top=mesh(new THREE.ConeGeometry(6+rnd()*4,h,7),i%2?leaf:leaf2,x,h*.72,z,true);trees.push({x,z,r:5})}
const baskets=[];targets.forEach((p,i)=>{const group=new THREE.Group();group.position.copy(p);scene.add(group);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,9,10),metal);pole.position.y=4.5;group.add(pole);const ring=new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.1,1.3,16,1,true),mat(colors[i]));ring.position.y=5.2;group.add(ring);const rim=new THREE.Mesh(new THREE.TorusGeometry(3.6,.38,8,16),metal);rim.rotation.x=Math.PI/2;rim.position.y=5.8;group.add(rim);for(let j=0;j<12;j++){const a=j*Math.PI/6;const chain=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,3.3,5),metal);chain.position.set(Math.cos(a)*2.7,7.4,Math.sin(a)*2.7);group.add(chain)}const flag=new THREE.Mesh(new THREE.BoxGeometry(4.6,2.6,.15),mat(colors[i]));flag.position.set(2.3,10.3,0);group.add(flag);baskets.push(group)});
const discMats=[mat(0xffd345),mat(0x5ac1f5),mat(0xf56c6c)];const disc=mesh(new THREE.CylinderGeometry(2.1,2.1,.35,24),discMats[1],tee.x,1.4,tee.z,true);const shadow=mesh(new THREE.CircleGeometry(2.4,20),mat(0x40865c),tee.x,.1,tee.z);shadow.rotation.x=-Math.PI/2;
let position=tee.clone(),yaw=.35,zoom=115,pitch=.62,selected=1,power=.65,shots=0,completed=new Set(),flying=null,drag=null,pointers=new Map(),pinch=0;
function sync(){document.querySelector('#score').textContent=shots+' THROWS · '+completed.size+'/5';document.querySelectorAll('[data-disc]').forEach(b=>b.classList.toggle('active',+b.dataset.disc===selected));document.querySelector('#pct').textContent=Math.round(power*100)+'%'}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',1700)}
function focus(t){yaw=Math.atan2(t.x-position.x,t.z-position.z)}
function updateCamera(){const target=new THREE.Vector3(position.x,3,position.z);const dist=zoom;camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(target.x,5,target.z)}
function reset(){location.reload()}
document.querySelector('#reset').onclick=reset;document.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{selected=+b.dataset.disc;disc.material=discMats[selected];sync()});document.querySelector('#power').oninput=e=>{power=+e.target.value/100;sync()};
document.querySelector('#throw').onclick=()=>{if(flying||completed.size===5)return;const len=[150,100,58][selected]*power;const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));flying={start:position.clone(),dir,len,t:0,d:selected};shots++;sync()};
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,moved:false};pinch=0});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1){yaw-=dx*.004;if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)zoom=Math.max(65,Math.min(310,zoom*pinch/d));pinch=d}updateCamera()});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&pointers.size===1){const xy=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(xy,camera);const hits=ray.intersectObjects(baskets,true);if(hits.length){const group=baskets.find(b=>{let o=hits[0].object;while(o.parent){if(o===b)return true;o=o.parent}return false});if(group)focus(group.position)}}pointers.delete(e.pointerId);pinch=0;drag=null});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=0});canvas.addEventListener('wheel',e=>{zoom=Math.max(65,Math.min(310,zoom+e.deltaY*.08));e.preventDefault()},{passive:false});
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;if(flying){flying.t=Math.min(1,flying.t+dt/1.55);const f=flying,t=f.t,curve=[14,5,1][f.d]*Math.sin(Math.PI*t)*t;const x=f.start.x+f.dir.x*f.len*t-f.dir.z*curve,z=f.start.z+f.dir.z*f.len*t+f.dir.x*curve,y=1.5+Math.sin(Math.PI*t)*[25,17,10][f.d]*power;disc.position.set(x,y,z);disc.rotation.z+=dt*12;shadow.position.set(x,.1,z);if(t===1){position.set(x,0,z);if(Math.hypot(x-48,z+33)<50){shots++;position.copy(f.start);toast('Water hazard · +1 throw')}else if(trees.some(tr=>Math.hypot(x-tr.x,z-tr.z)<tr.r)){toast('Tree landing')}const i=targets.findIndex((b,j)=>!completed.has(j)&&Math.hypot(position.x-b.x,position.z-b.z)<10);if(i>=0){completed.add(i);position.copy(targets[i]);baskets[i].visible=false;toast('Basket '+(i+1)+' complete!');if(completed.size===5){document.querySelector('#result').textContent=shots+' total throws';document.querySelector('#end').style.display='flex'}}disc.position.set(position.x,1.5,position.z);shadow.position.set(position.x,.1,position.z);flying=null;sync()}}else{disc.position.set(position.x,1.5,position.z);shadow.position.set(position.x,.1,position.z)}updateCamera();renderer.render(scene,camera)}sync();updateCamera();requestAnimationFrame(animate);
}catch(err){const e=document.querySelector('#error');e.style.display='block';e.textContent='Unable to load 3D game: '+err.message;console.error(err)}
</script></body></html>
